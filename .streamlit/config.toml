[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131C2B"
textColor = "#E5EAF1"
font = "sans serif"

[server]
headless = true
runOnSave = true
# Allow the app to be embedded behind the Lightning studio proxy/iframe.
enableCORS = false
enableXsrfProtection = false
enableWebsocketCompression = false

[browser]
gatherUsageStats = false
